services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: relayradar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: relayradar
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relayradar -d relayradar"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      STORE: postgres
      DATABASE_URL: postgres://relayradar:${POSTGRES_PASSWORD}@db:5432/relayradar?sslmode=disable
      SEED_DEMO: "true"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      SMTP_ADDR: ${SMTP_ADDR:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-alerts@relayradar.local}
      ALERT_FAILURE_EMAIL: ${ALERT_FAILURE_EMAIL:-}
      FAVICON_PROXY_URL: ${FAVICON_PROXY_URL:-}
      PROBE_INGEST_TOKEN: ${PROBE_INGEST_TOKEN:-}
      REACHABILITY_ENABLED: "true"
      ICON_DIR: /data/icons
    volumes:
      - icons:/data/icons
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"

  prober:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: ["/app/prober"]
    command: ["-config", "/config/probes.json", "-api", "http://api:8080", "-token", "${PROBE_INGEST_TOKEN:-}", "-interval", "10m"]
    volumes:
      - ./probes.json:/config/probes.json:ro
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      - api

  # Plain-HTTP local entry: http://localhost:8088, no certificate needed.
  nginx-http:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./deploy/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  pgdata:
  icons:
